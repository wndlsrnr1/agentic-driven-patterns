# Project-scoped Codex configuration
# Place at: .codex/config.toml

[agents]
max_threads = 8
max_depth = 1
job_max_runtime_seconds = 1200

[agents.requirements_interviewer]
description = "Read-only requirements interviewer: clarify intent with targeted questions + web/doc research."
config_file = "./agents/requirements-interviewer.toml"

[agents.planner]
description = "Read-only planner: produce a DDD + Clean Architecture plan with Waves/Tasks and verification."
config_file = "./agents/planner.toml"

[agents.feasibility_reviewer]
description = "Read-only feasibility reviewer: check executability, dependencies, commands, and missing steps."
config_file = "./agents/feasibility-reviewer.toml"

[agents.uncertainty_analyst]
description = "Read-only uncertainty analyst: identify unknowns/assumptions and design Wave 0 spikes."
config_file = "./agents/uncertainty-analyst.toml"

[agents.smell_detector]
description = "Read-only smell detector: detect over-engineering, boundary leaks, and Clean Architecture violations."
config_file = "./agents/smell-detector.toml"

[agents.intent_guard]
description = "Read-only intent guard: ensure plan/implementation aligns to user's ultimate intent and acceptance criteria."
config_file = "./agents/intent-guard.toml"

[agents.worker]
description = "Workspace-write implementation worker for a single Task. Small diffs, run checks, no scope creep."
config_file = "./agents/worker.toml"

[agents.implement_orchestrator]
description = "Workspace-write implementation orchestrator: execute approved PLAN by waves/tasks with worker delegation and wave verification."
config_file = "./agents/implement-orchestrator.toml"

[agents.security_auditor]
description = "Read-only security auditor: scan for security risks, secrets, unsafe patterns, dependency issues."
config_file = "./agents/security-auditor.toml"

[agents.requirements_auditor]
description = "Read-only requirements auditor: verify implementation meets PLAN acceptance criteria 1:1."
config_file = "./agents/requirements-auditor.toml"

[agents.quality_reviewer]
description = "Read-only code quality reviewer: lint/test/typecheck, maintainability, smells."
config_file = "./agents/quality-reviewer.toml"
