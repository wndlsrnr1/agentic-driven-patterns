services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: adp-server
    working_dir: /app
    command: npm run dev
    ports:
      - "${ADP_SERVER_PORT:-3001}:${ADP_SERVER_INTERNAL_PORT:-3001}"
    volumes:
      - ./server:/app
      - adp_server_node_modules:/app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: adp-client
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port ${ADP_CLIENT_INTERNAL_PORT:-5173}
    depends_on:
      - server
    ports:
      - "${ADP_CLIENT_PORT:-5173}:${ADP_CLIENT_INTERNAL_PORT:-5173}"
    volumes:
      - ./client:/app
      - adp_client_node_modules:/app/node_modules
    environment:
      CLIENT_INTERNAL_PORT: "${ADP_CLIENT_INTERNAL_PORT:-5173}"
      VITE_PROXY_TARGET_HOST: "server"
      VITE_PROXY_TARGET_PORT: "${ADP_SERVER_INTERNAL_PORT:-3001}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

volumes:
  adp_server_node_modules:
  adp_client_node_modules:
